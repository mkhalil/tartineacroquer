<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci — Tartine à Croquer</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF4EA;font-family:Inter,system-ui,sans-serif;color:#2A1A10;padding:20px;box-sizing:border-box}
.box{max-width:480px;text-align:center;background:#FFFDF9;border:1px solid #EADBC8;border-radius:28px;padding:44px 32px}
.box img{width:64px;height:64px;margin-bottom:12px}
.ok{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#5E8C3A;color:#fff;display:grid;place-items:center;font-size:1.7rem;font-weight:700}
h1{font-family:Fraunces,Georgia,serif;color:#3B2214;font-size:1.7rem;margin:0 0 10px}
p{color:#7A6555;line-height:1.6;margin:0 0 26px}
a{display:inline-block;background:#9A5B2E;color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px}
a:hover{background:#5B3219}
</style>
</head>
<body>
  <div class="box">
    <div class="ok">✓</div>
    <h1>Merci, votre message est bien envoyé !</h1>
    <p>Nous avons bien reçu votre demande et nous allons vous contacter très vite.</p>
    <a href="/">Retour au site</a>
  </div>
</body>
</html>
